name: Cortes B-roll
on:
  push:
    branches: [cortes-broll]
    paths: ["queries.json","selecao.json"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar
        if: hashFiles('selecao.json') == ''
        env: { PIXABAY_KEY: "${{ secrets.PIXABAY_KEY }}" }
        run: python buscar.py
      - name: Baixar
        if: hashFiles('selecao.json') != ''
        run: python baixar.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -m "resultado [skip ci]" && git push
