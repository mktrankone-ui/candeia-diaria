name: Narração avulsa (aula e-cotações)
# Ramo separado: gera áudios com a voz masculina da Candeia (Antonio) para a aula do e-cotações.
# Não mexe nos vídeos diários nem na main.
on:
  push:
    branches: [narracao-ecotacoes]
    paths: [narracao-ecotacoes/textos.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts
      - name: Gerar áudios
        run: python3 -u narracao-ecotacoes/gerar_audios.py
      - name: Salvar no ramo
        run: |
          git config user.name "candeia-bot"; git config user.email "actions@github.com"
          git add narracao-ecotacoes/audio
          git commit -qm "Áudios da aula e-cotações $(date -u +%F-%H%M)" && git push -q origin HEAD:narracao-ecotacoes || echo "nada novo"
