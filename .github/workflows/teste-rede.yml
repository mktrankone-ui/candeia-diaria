name: Teste de rede e narração
on:
  push:
    paths: [".github/workflows/teste-rede.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Testa acessos
        run: |
          mkdir -p teste
          echo "pixabay api: $(curl -s -o /dev/null -w '%{http_code}' 'https://pixabay.com/api/?q=sky')" >> teste/resultado.txt
          echo "pixabay cdn: $(curl -s -o /dev/null -w '%{http_code}' 'https://cdn.pixabay.com/video/2024/02/21/201308-915375262_tiny.jpg')" >> teste/resultado.txt
          echo "freesound: $(curl -s -o /dev/null -w '%{http_code}' 'https://freesound.org/apiv2/')" >> teste/resultado.txt
          echo "jamendo: $(curl -s -o /dev/null -w '%{http_code}' 'https://api.jamendo.com/v3.0/')" >> teste/resultado.txt
          echo "elevenlabs: $(curl -s -o /dev/null -w '%{http_code}' 'https://api.elevenlabs.io/v1/models')" >> teste/resultado.txt
          cat teste/resultado.txt
      - name: Narração de amostra (edge-tts)
        run: |
          pip install -q edge-tts
          for v in pt-BR-AntonioNeural pt-BR-FranciscaNeural pt-BR-ThalitaMultilingualNeural; do
            edge-tts --voice $v --rate=-12% --text "Senhor, obrigado por mais um amanhecer. Antes de qualquer tarefa, eu entrego este dia em Tuas mãos. Acende em mim a Tua luz, para que eu não ande no escuro do medo." --write-media teste/voz-$v.mp3 && echo "tts $v: ok" >> teste/resultado.txt || echo "tts $v: falhou" >> teste/resultado.txt
          done
          edge-tts --list-voices | grep pt-BR >> teste/vozes.txt || true
      - name: Salva resultado no ramo testes
        run: |
          git config user.name "candeia-bot"; git config user.email "actions@github.com"
          git checkout --orphan testes
          git rm -rq --cached . 
          git add -f teste
          git commit -qm "Resultado do teste de rede"
          git push -f origin testes
