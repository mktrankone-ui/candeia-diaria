name: Testar narração
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts numpy pillow faster-whisper
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Vídeos recentes
        run: |
          git fetch -q origin videos:videos
          mkdir -p pub
          for f in $(git ls-tree --name-only videos | grep '\.mp4$' | tail -8); do git show videos:$f > pub/$f; done
      - name: Teste
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python3 -u ferramentas/teste_narracao.py
      - name: Salva resultado no ramo testes
        run: |
          git config user.name "candeia-bot"; git config user.email "actions@github.com"
          cp -r teste /tmp/teste && rm -rf teste pub
          git fetch -q origin testes && git checkout -q -f -B testes FETCH_HEAD || git checkout -q --orphan testes
          rm -rf teste && cp -r /tmp/teste teste
          git add -f teste && git commit -qm "Teste de narração $(date -u +%F-%H%M)" && git push -q origin testes
